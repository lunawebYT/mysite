<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Био карточка</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      background: #000;
    }

    /* animated background */
    .bg {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 20% 20%, #ff4d4d33, transparent 40%),
                  radial-gradient(circle at 80% 30%, #4d79ff33, transparent 40%),
                  radial-gradient(circle at 50% 80%, #4dffb833, transparent 40%);
      animation: moveBg 12s infinite alternate ease-in-out;
      filter: blur(40px);
    }

    @keyframes moveBg {
      0% { transform: translate(-10%, -10%) scale(1); }
      100% { transform: translate(-5%, -5%) scale(1.2); }
    }

    .card {
      position: relative;
      width: 360px;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      animation: pop 1s ease forwards;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 28px;
      text-align: center;
      animation: fadeIn 1s ease forwards;
    }

    .title {
      text-align: center;
      margin-top: 8px;
      font-weight: bold;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.3s;
    }

    .block {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      opacity: 0;
      transform: translateY(10px);
      animation: slideUp 0.6s ease forwards;
    }

    .block:nth-child(3) { animation-delay: 0.5s; }
    .block:nth-child(4) { animation-delay: 0.7s; }
    .block:nth-child(5) { animation-delay: 0.9s; }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .tag {
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      opacity: 0.5;
    }

    /* floating particles */
    .dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      opacity: 0.2;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(-80px); opacity: 0.1; }
    }
  </style>
</head>
<body>

<div class="bg"></div>

<!-- particles -->
<script>
  for (let i = 0; i < 20; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = Math.random() * 100 + 'vw';
    dot.style.top = Math.random() * 100 + 'vh';
    dot.style.animationDuration = (3 + Math.random() * 5) + 's';
    document.body.appendChild(dot);
  }
</script>

<div class="card">
  <h1>Артур Микаэлян</h1>
  <div class="title">самый лучший из армян</div>

  <div class="block">
    Я программист, создаю веб-приложения и сервисы.
  </div>

  <div class="block">
    Люблю чистый код, архитектуру и стабильные системы.
  </div>

  <div class="block">
    Работаю с frontend и backend, изучаю новые технологии.
  </div>

  <div class="block">
    Постоянно развиваюсь и пишу собственные проекты.
  </div>

  <div class="tag">HTML • CSS • JS • Animated Profile</div>
</div>

</body>
</html>
